<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sagnick Das — Backend and AI Infrastructure Engineer">
  <defs>
    <linearGradient id="canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#121821"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="280" rx="18" fill="url(#canvas)"/>

  <!-- identity block -->
  <text x="56" y="108" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#E6EDF3">Sagnick Das</text>
  <text x="58" y="144" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#56D4C4">Backend &amp; AI Infrastructure Engineer</text>
  <text x="58" y="172" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#8B949E">LLMs · RAG · Autonomous Agents · Concurrent Systems</text>
  <text x="58" y="226" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#4B5560">// currently shipping: agents that survive outside the demo</text>

  <!-- signature motif: concurrent request lanes gated down to one safe response -->
  <text x="680" y="46" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="1" fill="#4B5560">4 CONCURRENT REQUESTS  →  1 SAFE RESPONSE</text>

  <g fill="none" stroke-linecap="round">
    <path d="M680,70  C 820,70  880,130 1000,130" stroke="#30363D" stroke-width="2.5"/>
    <path d="M680,110 C 820,110 880,130 1000,130" stroke="#30363D" stroke-width="2.5"/>
    <path d="M680,150 C 820,150 880,130 1000,130" stroke="#F2A65A" stroke-width="2.5"/>
    <path d="M680,190 C 820,190 880,130 1000,130" stroke="#30363D" stroke-width="2.5"/>
    <path d="M1000,130 L1150,130" stroke="#56D4C4" stroke-width="3.5"/>
  </g>

  <circle cx="680" cy="70"  r="4" fill="#30363D"/>
  <circle cx="680" cy="110" r="4" fill="#30363D"/>
  <circle cx="680" cy="150" r="4" fill="#F2A65A"/>
  <circle cx="680" cy="190" r="4" fill="#30363D"/>
  <circle cx="1000" cy="130" r="5" fill="#56D4C4"/>
  <circle cx="1150" cy="130" r="4" fill="#56D4C4"/>
</svg>
